name: Build Electron App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# Un `permissions:` explicite ici prime sur le réglage par défaut du repo
# ("Read repository contents permission" en lecture seule) — nécessaire pour
# que GITHUB_TOKEN puisse créer une Release lors de la publication.
permissions:
  contents: write

jobs:
  # Type-check + tests unitaires (même commande que le hook pre-commit).
  # Sous Windows : certains tests portent sur des chemins Windows (Sandboxie).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and unit tests
        run: npm run check

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (smoke test)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:main && npm run build:renderer && npx electron-builder --win --publish never

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:main && npm run build:renderer && npx electron-builder --win --publish always

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            release/*.exe

  build-macos:
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (smoke test)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:main && npm run build:renderer && npx electron-builder --mac --publish never

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:main && npm run build:renderer && npx electron-builder --mac --publish always

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            release/*.dmg

  # electron-builder crée la release sans description : on y écrit ensuite
  # quel fichier télécharger (.github/release-notes.md, <version> remplacé).
  release-notes:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed "s/<version>/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
